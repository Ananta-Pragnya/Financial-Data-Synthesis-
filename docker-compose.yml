services:
  knowledge-graph-db:
    build:
      context: .
      dockerfile: Dockerfile.neo4j
    container_name: dax40-knowledge-graph-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - ./neo4j-data:/data
      - ./import:/var/lib/neo4j/import:ro
      - ./cypher:/cypher:ro
    environment:
      - NEO4J_AUTH=neo4j/12345678
      - NEO4J_server_memory_heap_initial__size=1G
      - NEO4J_server_memory_heap_max__size=2G
      - NEO4J_server_config_strict__validation_enabled=false
      - NEO4J_apoc_import_file_enabled=true
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p 12345678 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

